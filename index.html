<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caixa do Restaurante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: menu lateral de botões grandes + área de trabalho; fundo branco, cards de cor cheia por função. Tema único (claro) por escolha do dono. */
:root{
  color-scheme:light;
  --bg:#eeeff3; --soft:#f5f4f9; --line:#e6e3ee; --ink:#1c1a27; --muted:#676378;
  --comida:#d44c14; --acai:#531f78; --pix:#0c9c8b; --credito:#2a66dd; --debito:#8a4fd0; --dinheiro:#27924a;
  --doce:#d83f77; --bebida:#1f86c9;
  --ok:#1f8a44; --warn:#b86a00; --bad:#cf3434;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:28px} h2{font-size:20px} h3{font-size:16px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.app.min{grid-template-columns:minmax(0,1fr)}
.app.min nav{display:none}
.work{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 24px;border-bottom:2px solid var(--line);background:#fff}
.tinfo,.who{display:flex;flex-direction:column;line-height:1.25}
.tinfo span,.who span{color:var(--muted);font-size:13px}
.tright{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.banner{background:#fdecc8;border:2px solid var(--warn);border-radius:var(--r);padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;color:#5c3600}
.banner>div:first-child{display:flex;flex-direction:column;gap:4px;font-size:17px;flex:1;min-width:240px}
.banner .row>.btn{flex:none}
.scale.off{opacity:.55}
.chip:disabled,.prod:disabled{opacity:.5;cursor:not-allowed}
nav{background:var(--soft);padding:16px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.brand{font:800 22px/1.1 var(--display);padding:6px 8px 12px}
.brand small{display:block;font:500 13px var(--body);color:var(--muted);margin-top:4px}
.nav{display:flex;align-items:center;min-height:56px;padding:0 16px;border:0;border-radius:16px;background:transparent;font-weight:600;font-size:17px;text-align:left}
.nav:hover{background:#eae8f2}
.nav.on{background:var(--ink);color:#fff}
main{flex:1;min-height:0;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted)}
.btn{min-height:56px;padding:0 22px;border-radius:16px;border:2px solid transparent;font-weight:700;font-size:17px;background:var(--ink);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.line{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.white{background:#fff;color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.5)}
.btn.sm{min-height:44px;font-size:15px;padding:0 16px;border-radius:12px}
.btn.go{background:var(--ok);width:100%;min-height:68px;font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>.btn{flex:1}
.panel{background:#fff;border:2px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--soft)}
.pill.ok{background:#dff3e5;color:#156632}.pill.warn{background:#fdecc8;color:#7a4700}.pill.bad{background:#fbdcdc;color:#952020}
.pill.onc{background:rgba(255,255,255,.22);color:#fff}
.lbl{font-size:13px;font-weight:600;opacity:.85}
.pdv{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.scales{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.scale{border-radius:var(--r);padding:20px;color:#fff;display:flex;flex-direction:column;gap:14px}
.scale.comida{background:var(--comida)}.scale.acai{background:var(--acai)}
.scale header{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.peso{background:rgba(0,0,0,.2);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column}
.peso strong{font:800 44px/1.05 var(--display)}
.taras{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.taras .lbl{width:100%}
.chip{min-height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.scale .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}
.scale .chip.on{background:#fff;color:var(--ink);border-color:#fff}
.chip.inp input{width:58px;border:0;border-radius:8px;padding:6px;background:#fff;color:var(--ink)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.calc dt{font-size:13px;opacity:.85}.calc dd{margin:0;font-weight:700;font-size:18px}
.calc dd.big{font:800 26px/1.1 var(--display)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prod{min-height:84px;border:0;border-radius:16px;padding:12px 14px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.pf{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;width:100%;min-height:104px;border:0;border-radius:var(--r);background:var(--ink);color:#fff;padding:18px 22px;text-align:left}
.pf small{display:block;font-size:13px;font-weight:600;opacity:.8}
.pf b{display:block;font:800 30px/1.1 var(--display)}
.pf strong{font:800 38px/1 var(--display);margin-left:auto}
.pf em{font-style:normal;font-weight:700;font-size:17px;background:#fff;color:var(--ink);border-radius:14px;padding:16px 22px}
.pf:disabled{opacity:.5;cursor:not-allowed}
.venda .formas{grid-template-columns:repeat(4,1fr);gap:8px}
.venda .forma{min-height:56px;font-size:15px}
.fim{position:sticky;bottom:0;background:#fff;padding:8px 0 2px}
.cart li.gh{background:transparent;padding:8px 4px 0;grid-template-columns:1fr auto;font-size:13px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:10px;align-items:center}
.drow{display:grid;grid-template-columns:84px 130px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px}
#modal .panel{max-height:100%;overflow:auto}
tr.cont td{color:var(--muted)}
@media (min-width:1101px) and (min-height:701px){
  main.fixo{overflow:hidden}
  main.fixo .pdv{flex:1;min-height:0;align-items:stretch}
  main.fixo .pdv>.col{overflow:auto;min-height:0;padding:14px 14px 4px 0}
  main.fixo .pdv>aside.col{padding:0}
  main.fixo .venda{min-height:100%}
  main.fixo .venda .lista{max-height:30vh;overflow:auto}
}
@media (max-width:720px){.drow{grid-template-columns:1fr 1fr}.mrow{grid-template-columns:1fr 1fr}}
.scale,.pf,.prod{position:relative}
.qt{position:absolute;top:-12px;right:-12px;min-width:44px;height:44px;padding:0 10px;border-radius:99px;background:#fff;color:var(--ink);border:3px solid var(--ink);display:grid;place-items:center;font:800 22px/1 var(--display)}
.qt.z{color:var(--muted);border-color:var(--line)}
.parcial{display:flex;align-items:center;gap:14px;padding:8px 18px;border-radius:16px;background:var(--soft);min-height:56px}
.parcial.tem{background:var(--ok);color:#fff}
.parcial span{font-weight:600;font-size:14px;line-height:1.2}
.parcial strong{font:800 30px/1 var(--display)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:no-preference){.parcial.bump{animation:bump .35s ease-out}}
.prod.prato{background:var(--ink)}
.prod.doce{background:var(--doce)}.prod.bebida{background:var(--bebida)}
.prod b{font-size:16px}.prod span{font-weight:600;opacity:.95}
.cart{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cart li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px}
.cart small{display:block;color:var(--muted)}
.x{width:40px;height:40px;border-radius:10px;border:0;background:#fff;font-size:20px;font-weight:700;color:var(--bad)}
.empty{color:var(--muted);background:var(--soft);border-radius:14px;padding:16px}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot.g strong{font:800 36px/1 var(--display)}
.formas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.forma{min-height:64px;border-radius:16px;border:3px solid transparent;color:#fff;font-weight:700;font-size:18px;opacity:.55}
.forma.on,.forma.none{opacity:1}.forma.on{border-color:var(--ink)}
.f-pix{background:var(--pix)}.f-credito{background:var(--credito)}.f-debito{background:var(--debito)}.f-dinheiro{background:var(--dinheiro)}
.cash{display:flex;flex-direction:column;gap:10px}
label{font-weight:600;font-size:14px}
input[type=text],input[type=password],input[type=url],select,.field{min-height:52px;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;width:100%}
#recebido{font:800 28px var(--display);min-height:64px}
.troco{border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;background:#dff3e5;color:#124f28}
.troco.falta{background:#fdecc8;color:#6b3f00}
.troco strong{font:800 34px/1 var(--display)}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{border-radius:var(--r);padding:16px;color:#fff;display:flex;flex-direction:column;gap:4px}
.kpi strong{font:800 28px/1.1 var(--display)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.chart{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
.bar{flex:1;min-width:18px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.track{height:180px;width:100%;display:flex;align-items:flex-end;background:linear-gradient(to top,var(--line) 1px,transparent 1px) 0 0/100% 25%}
.track i{display:block;width:100%;background:var(--comida);border-radius:8px 8px 0 0}
.bar.today .track i{background:var(--ink)}
.hb{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center}
.hb .t{height:16px;border-radius:99px;background:var(--soft);overflow:hidden}.hb .t i{display:block;height:100%;border-radius:99px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted)} td.n,th.n{text-align:right}
.menu-cat{display:flex;flex-direction:column;gap:8px}
.dish{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:8px 8px 8px 14px}
.dish.off span{text-decoration:line-through;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.form>div{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:520px;border-radius:18px;padding:12px 14px;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:#d9f7d0}.bubble.bot{background:var(--soft)}
pre{margin:0;background:var(--ink);color:#f3f1fa;border-radius:14px;padding:14px;overflow-x:auto;font-size:13px}
.sw{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:10px 14px;font-weight:600}
.sw input{width:26px;height:26px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 20px;border-radius:16px;font-weight:600;max-width:calc(100% - 32px);display:none;z-index:20}
#login,#modal{position:fixed;inset:0;background:var(--soft);display:none;place-items:center;padding:16px;z-index:10}
#modal{background:rgba(28,26,39,.45);z-index:9}
#login .panel,#modal .panel{width:min(440px,100%)}
@media (max-width:1100px){.pdv{grid-template-columns:1fr}}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;top:0;bottom:0;left:0;width:240px;z-index:6;box-shadow:0 0 0 100vmax rgba(28,26,39,.35)}
  main{padding:16px}.top{padding:10px 16px}
}
@media (prefers-reduced-motion:no-preference){.btn,.nav,.chip,.forma{transition:background .15s,opacity .15s}}

/* ---------- acabamento premium ---------- */
:root{--shadow:0 1px 2px rgba(28,26,39,.05),0 10px 28px rgba(28,26,39,.07)}
h1{letter-spacing:-.02em}h2{letter-spacing:-.01em}
.app{grid-template-columns:224px minmax(0,1fr)}
nav{background:var(--ink);color:#fff;padding:18px 14px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-size:19px}
.brand i{width:38px;height:38px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--comida),var(--acai));display:grid;place-items:center;font:800 18px var(--display);color:#fff}
.brand small{color:rgba(255,255,255,.55);margin-top:2px;font-size:12px}
.nav{gap:12px;min-height:50px;padding:0 14px;border-radius:13px;font-size:15.5px;color:rgba(255,255,255,.78)}
.nav svg,.ib svg{width:20px;height:20px;flex:none}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav.on{background:#fff;color:var(--ink);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.nav:focus-visible{outline-color:#fff}
.top{flex-wrap:nowrap;gap:12px;padding:10px 20px;min-height:68px;border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(28,26,39,.05);position:relative;z-index:3}
.ib{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.ib:hover,.user:hover{background:var(--soft)}
.tinfo{flex:none}.tinfo b{font-size:14px;white-space:nowrap}.tinfo span{font-size:12px}
.inds{display:flex;align-items:stretch;flex:none;border:1px solid var(--line);border-radius:14px;background:var(--soft);overflow:hidden}
.ind{display:flex;align-items:center;gap:9px;padding:6px 13px;border-left:1px solid var(--line);line-height:1.15;white-space:nowrap}
.ind:first-child{border-left:0}
.ind small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ind b{font-size:13px}
.dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,138,68,.18)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(184,106,0,.2)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(207,52,52,.2)}
.parcial{margin-left:auto;flex:none;min-height:48px;padding:6px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;gap:12px}
.parcial.tem{background:linear-gradient(135deg,#1f8a44,#147a58);border-color:transparent;box-shadow:0 8px 20px -8px rgba(31,138,68,.65)}
.parcial span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.parcial strong{font-size:24px;white-space:nowrap}
.tright{margin-left:0;gap:8px;flex-wrap:nowrap;flex:none}
.top .btn.sm{min-height:44px;border-radius:12px;font-size:14px;padding:0 14px;border-width:1px;white-space:nowrap}
.user{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 4px;border-radius:99px;border:1px solid var(--line);background:#fff;text-align:left}
.av{width:36px;height:36px;flex:none;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 13px var(--body)}
.who b{font-size:13.5px;white-space:nowrap}.who span{font-size:11.5px;white-space:nowrap}
.panel{border:1px solid var(--line);box-shadow:var(--shadow)}
.btn{box-shadow:0 1px 2px rgba(28,26,39,.14)}
.btn.line{border-width:1px;box-shadow:none}
.btn.go{background:linear-gradient(135deg,#1f8a44,#147a58);box-shadow:0 10px 22px -10px rgba(31,138,68,.75)}
.chip,input[type=text],input[type=password],input[type=url],select{border-width:1px}
input:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(28,26,39,.12)}
.scale,.kpi,.pf,.prod,.forma{background-image:linear-gradient(155deg,rgba(255,255,255,.17),rgba(255,255,255,0) 45%,rgba(0,0,0,.13)) !important}
.scale.comida{box-shadow:0 18px 30px -18px rgba(238,93,35,.8)}
.scale.acai{box-shadow:0 18px 30px -18px rgba(106,43,147,.8)}
.pf{box-shadow:0 18px 30px -18px rgba(95,111,42,.85)}
.kpi{box-shadow:var(--shadow)}
.pf,.prod.prato{background-color:#5f6f2a}
main>.note{background:#fff;border:1px solid var(--line)}
.pdv>.col>*,.venda>*{flex-shrink:0}
.kpi .lbl,.scale .lbl{letter-spacing:.05em;text-transform:uppercase;font-size:11.5px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
tbody tr:hover td{background:#faf9fd}
.qt{border-width:2px;box-shadow:0 4px 10px rgba(28,26,39,.22)}
.banner{border-width:1px;box-shadow:var(--shadow)}
.head p{font-size:14.5px}
#login{background:radial-gradient(1100px 600px at 15% 0%,#ece6f6,#f5f4f9)}
#login .panel,#modal .panel{box-shadow:0 30px 60px -20px rgba(28,26,39,.35)}
@media (max-width:1480px){.tinfo{display:none}}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;top:0;bottom:0;left:0;width:248px;z-index:6;box-shadow:0 0 0 100vmax rgba(28,26,39,.45)}
  .top{flex-wrap:wrap;padding:10px 14px}
  .inds{order:5;flex:1 1 100%;overflow-x:auto}
  .parcial{flex:1 1 auto}
  .who{display:none}.user{padding:0 4px}
  main{padding:16px}
}
@media (max-width:560px){
  h1{font-size:23px}
  .top{gap:8px}.top .btn.sm{padding:0 10px;font-size:13px}
  .parcial{padding:6px 12px}.parcial strong{font-size:20px}
  .ind{padding:6px 10px}
  .peso strong{font-size:36px}.calc dd.big{font-size:21px}.calc dd{font-size:16px}
  .kpis{grid-template-columns:1fr 1fr}.kpi strong{font-size:22px}
  .pf b{font-size:24px}.pf strong{font-size:30px}.pf em{flex:1 1 100%;text-align:center}
  .panel{padding:14px}
  .venda .formas{grid-template-columns:1fr 1fr}
}

/* ---------- perfil do operador ---------- */
.top{border-top:5px solid var(--op,var(--ink))}
.user{background:var(--op,var(--ink));border-color:transparent;color:#fff}
.user:hover{background:var(--op,var(--ink));filter:brightness(1.12)}
.user .who span{color:rgba(255,255,255,.82)}
.user .av{background:rgba(255,255,255,.22)}
.av{overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.mini{display:inline-grid;width:30px;height:30px;font-size:11px;vertical-align:middle;margin-right:8px}
.av.grande{width:84px;height:84px;font-size:28px;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.7)}
.perfil-topo{display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;color:#fff}
.perfil-topo b{display:block;font:800 22px/1.15 var(--display)}
.perfil-topo span span,.perfil-topo div span{font-size:13px;opacity:.85;overflow-wrap:anywhere}
.cor{width:44px;height:44px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}

.cor{position:relative}
.cor.padrao{background:linear-gradient(135deg,#1c1a27 50%,#3b3e46 50%)}

.conf-total{display:flex;justify-content:space-between;align-items:baseline;background:var(--soft);border-radius:16px;padding:14px 16px}

.btn.nao{min-height:60px;color:var(--bad);border-color:var(--bad)}

.aba.on{background:var(--op);border-color:var(--op);color:#fff}

.vhead h2{margin:0}
.chip.sm{min-height:36px;padding:0 12px;font-size:13px}
.chip.perigo{background:var(--bad,#c62828);border-color:var(--bad,#c62828);color:#fff}

const Z=()=>({fat:0,gCom:0,gAcai:0,n:0,itens:0,pix:0,credito:0,debito:0,dinheiro:0});

function aggVendas(vs){const a=Z();vs.forEach(v=>{a.fat+=v.total;a.n++;v.pags.forEach(p=>a[p.forma]+=p.valor);v.itens.forEach(i=>{if(i.grupo==='produto')a.itens++;else if(i.grupo==='acai')a.gAcai+=i.g;else a.gCom+=i.g})});return a}
function genDay(seed){const r=rng(seed),a=Z();a.n=88+Math.floor(r()*50);a.fat=a.n*(2900+Math.floor(r()*700));a.gCom=a.n*(430+Math.floor(r()*90));a.gAcai=Math.floor(a.n*.3*(320+r()*90));a.itens=Math.floor(a.n*(.3+r()*.12));a.pix=Math.round(a.fat*(.38+r()*.08));a.debito=Math.round(a.fat*(.2+r()*.06));a.credito=Math.round(a.fat*(.17+r()*.06));a.dinheiro=a.fat-a.pix-a.debito-a.credito;return a}
const dkey=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const aggDia=d=>dkey(d)===dkey(hoje)?aggVendas(S.vendas):genDay(dkey(d));
function aggMes(y,m){const a=Z(),atual=y===hoje.getFullYear()&&m===hoje.getMonth(),ult=atual?hoje.getDate():new Date(y,m+1,0).getDate();for(let d=1;d<=ult;d++)soma(a,aggDia(new Date(y,m,d)));return a}
function buckets(p){
  const y=hoje.getFullYear(),m=hoje.getMonth(),d=hoje.getDate(),b=[];
  if(p==='diario'){const hs=S.vendas.map(v=>v.ts.getHours());if(!hs.length)return b;for(let h=Math.min(...hs);h<=Math.max(...hs);h++)b.push({l:h+'h',a:aggVendas(S.vendas.filter(v=>v.ts.getHours()===h))})}
  if(p==='semanal')for(let i=6;i>=0;i--){const x=new Date(y,m,d-i);b.push({l:DIA[x.getDay()]+' '+x.getDate(),a:aggDia(x),hoje:i===0})}
  if(p==='mensal')for(let i=1;i<=d;i++)b.push({l:String(i),a:aggDia(new Date(y,m,i)),hoje:i===d});
  if(p==='semestral')for(let i=5;i>=0;i--){const x=new Date(y,m-i,1);b.push({l:MES[x.getMonth()],a:aggMes(x.getFullYear(),x.getMonth()),hoje:i===0})}
  if(p==='anual')for(let i=0;i<=m;i++)b.push({l:MES[i],a:aggMes(y,i),hoje:i===m});
  return b;
}
const cli=()=>S.clientes.find(c=>c.id===S.clienteId);

/* ---------- vendas em abas (até 4 em aberto) ----------
   A venda da aba ativa vive em S.cart, S.forma etc., como sempre. As outras ficam guardadas em S.abas. */
const MAX_ABAS=4,CAMPOS=['cart','pags','mx','dv','clienteId','resgate','forma','recebido','novoCli'];
const vendaVazia=()=>({cart:[],pags:null,mx:{pix:'',credito:'',debito:'',dinheiro:'',rec:''},dv:[],clienteId:'',resgate:false,forma:'',recebido:'',novoCli:false});

async function carregarBase(){
  const [b,pr,cf,cl,p30,cd]=await Promise.all([
    q(sb.from('balancas').select('*,taras(*)').eq('ativo',true).order('ordem').order('criado_em'),'Balanças'),
    q(sb.from('produtos').select('*').eq('ativo',true).order('criado_em'),'Produtos'),
    q(sb.from('config').select('*').eq('id',1).maybeSingle(),'Configuração'),
    q(sb.from('clientes').select('*').order('nome'),'Clientes'),
    q(sb.rpc('pontos_30_dias'),'Pontos'),
    q(sb.from('cardapio_itens').select('*').order('criado_em'),'Cardápio')]);
  if(Array.isArray(b)){const ant={};S.balancas.forEach(x=>ant[x.id]=x);
    S.balancas=b.map(x=>{const ts=[{n:'Sem tara',g:0}].concat((x.taras||[]).slice().sort((m,n)=>m.gramas-n.gramas).map(t=>({n:t.nome,g:t.gramas}))),a=ant[x.id];
      return{id:x.id,nome:x.nome,grupo:x.grupo,marca:x.marca,conexao:x.conexao,baud:String(x.baud),precoKg:x.preco_kg_centavos,bruto:a?a.bruto:0,tara:a?a.tara:(ts[1]?ts[1].g:0),conectada:a?a.conectada:true,taras:ts}})}
  if(Array.isArray(pr))S.produtos=pr.map(x=>({id:x.id,nome:x.nome,preco:x.preco_centavos,cat:x.categoria,destaque:x.destaque}));
  if(cf&&cf!==true){S.regras={base:cf.base_pontos,pontosResgate:cf.pontos_resgate,valorResgate:cf.valor_resgate_centavos,minGrupo:cf.min_pontos_grupo};S.fundo=cf.fundo_troco_centavos}
  if(Array.isArray(cl)){const m={};(Array.isArray(p30)?p30:[]).forEach(x=>m[x.cliente_id]=Number(x.pontos));S.clientes=cl.map(x=>({id:x.id,nome:x.nome,fone:x.telefone,pontos:x.pontos,g:Number(x.gramas_total),gasto:Number(x.gasto_centavos),p30:m[x.id]||0}))}
  if(Array.isArray(cd))S.cardapio=cd.map(x=>({id:x.id,cat:x.categoria,nome:x.nome,on:x.disponivel}));
  // Se algum preço mudou, a venda em andamento acompanha o banco.
  if(S.logged&&S.abasDe!==S.user.id)abasRestaurar();
  if(!S.abas.length)abasReset();
  let mudou=false;abaGuardar();
  S.abas.forEach(a=>{let m=false;
    a.cart.forEach(i=>{let v=i.valor;if(i.grupo==='produto'){const x=S.produtos.find(y=>y.id===i.src);if(x)v=x.preco}else{const x=S.balancas.find(y=>y.id===i.src);if(x){i.precoKg=x.precoKg;v=Math.round(i.g*x.precoKg/1000)}}if(v!==i.valor){i.valor=v;m=true}});
    if(m){a.pags=null;mudou=true}
    // Cliente apagado, ou pontos já usados em outra venda: o desconto sai desta aba.
    if(a.clienteId&&!S.clientes.some(c=>c.id===a.clienteId)){a.clienteId='';a.resgate=false;a.pags=null}
    if(a.resgate&&!totaisDe(a).pode&&a.cart.length){a.resgate=false;a.pags=null;if(a!==S.abas[S.aba]||!S.enviando)toast('Venda '+a.n+': o desconto de pontos saiu, porque os pontos já foram usados. Confira o total.')}});
  abaCarregar(Math.min(S.aba,S.abas.length-1));

}

function cropLim(){const c=S.crop,V=560,s=Math.max(V/c.w,V/c.h)*c.z,dw=c.w*s,dh=c.h*s;c.ox=Math.max(-(dw-V)/2,Math.min((dw-V)/2,c.ox));c.oy=Math.max(-(dh-V)/2,Math.min((dh-V)/2,c.oy));return{V,dw,dh}}
function cropDesenhar(){const cv=document.getElementById('crop-cv');if(!cv||!S.crop)return;const g=cv.getContext('2d'),c=S.crop,L=cropLim(),r=L.V/2-4;
  g.clearRect(0,0,L.V,L.V);g.drawImage(c.im,(L.V-L.dw)/2+c.ox,(L.V-L.dh)/2+c.oy,L.dw,L.dh);
  g.fillStyle='rgba(28,26,39,.6)';g.beginPath();g.rect(0,0,L.V,L.V);g.arc(L.V/2,L.V/2,r,0,Math.PI*2,true);g.fill('evenodd');
  g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.arc(L.V/2,L.V/2,r,0,Math.PI*2);g.stroke()}

document.addEventListener('pointerdown',ev=>{if(ev.target.id!=='crop-cv'||!S.crop)return;arrasto={x:ev.clientX,y:ev.clientY,ox:S.crop.ox,oy:S.crop.oy,k:560/ev.target.getBoundingClientRect().width};try{ev.target.setPointerCapture(ev.pointerId)}catch(_){}ev.preventDefault()});
document.addEventListener('pointermove',ev=>{if(!arrasto||!S.crop)return;S.crop.ox=arrasto.ox+(ev.clientX-arrasto.x)*arrasto.k;S.crop.oy=arrasto.oy+(ev.clientY-arrasto.y)*arrasto.k;cropDesenhar()});

  definirSenha:()=>{const s=$('#au-nova').value;if(s.length<8){S.authMsg='A senha precisa ter pelo menos 8 caracteres.';return}
    sb.auth.updateUser({password:s}).then(async r=>{if(r.error){S.authMsg=authErr(r.error);return render()}
      S.recuperando=false;S.authMsg='';toast('Senha alterada.');const g=await sb.auth.getSession();aoSessao(g.data.session)});return true},
  reverificar:()=>{S.authMsg='';sb.auth.getSession().then(g=>aoSessao(g.data.session));return true},
  salvarSenha:()=>{const s=$('#cs-nova').value;if(s.length<8){toast('A senha precisa ter pelo menos 8 caracteres.');return true}
    sb.auth.updateUser({password:s}).then(r=>{if(r.error)return toast(authErr(r.error));if(S.conta)S.conta.senha='';toast('Senha alterada.');render()});return true},
  userAtivo:e=>{const u=S.perfis.find(x=>x.id===e.dataset.id);mudarPerfil(u.id,{ativo:!u.ativo},u.ativo?'Acesso de '+u.nome+' desativado.':'Acesso de '+u.nome+' liberado.');return true},
  novoUser:()=>{const nome=$('#nu-nome').value.trim(),email=$('#nu-email').value.trim().toLowerCase(),senha=$('#nu-senha').value,perfil=$('#nu-perfil').value;
    if(!nome||!emailOk(email)){toast('Preencha o nome e um e-mail válido.');return true}
    if(senha.length<8){toast('A senha provisória precisa ter pelo menos 8 caracteres.');return true}
    toast('Cadastrando…');
    const tmp=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'sb-cadastro-temporario'}});
    tmp.auth.signUp({email,password:senha,options:{data:{nome}}}).then(async r=>{
      if(r.error)return toast(authErr(r.error));
      const u=r.data.user;if(!u||(u.identities&&!u.identities.length))return toast('Já existe uma conta com esse e-mail.');
      await mudarPerfil(u.id,{ativo:true,perfil,nome},nome+' cadastrado e liberado.');
    },e=>toast(authErr(e)));return true},
  menu:()=>{S.menu=!S.menu},
  abrirFechar:()=>{const n=abasComItens();if(n){toast(n===1?'Há 1 venda em aberto. Finalize ou descarte antes de fechar o caixa.':'Há '+n+' vendas em aberto. Finalize ou descarte antes de fechar o caixa.');return true}S.modal='fechar'},
  abaIr:e=>{if(S.enviando)return true;const k=+e.dataset.k;if(k===S.aba||!S.abas[k])return true;abaGuardar();abaCarregar(k);S.modal=null},
  abaNova:()=>{if(S.enviando)return true;abaGuardar();const l=S.abas.findIndex(abaLivre);
    if(l>=0){if(l===S.aba){toast('Esta venda já está vazia. Use ela para o próximo cliente.');return true}abaCarregar(l);return}
    if(S.abas.length>=MAX_ABAS){toast('Limite de '+MAX_ABAS+' vendas em aberto. Finalize ou descarte uma para abrir outra.');return true}
    S.abas.push(Object.assign({n:abaNumLivre()},vendaVazia()));abaCarregar(S.abas.length-1)},
  abaDescartar:()=>{if(S.enviando)return true;if(S.cart.length&&!S.abaConf){S.abaConf=true;return}
    const tinha=S.cart.length,n=(S.abas[S.aba]||{n:1}).n;abaGuardar();
    if(S.abas.length>1)abaTirar(S.aba);else abasReset();
    if(tinha)toast('Venda '+n+' descartada. Nada foi registrado.')},
  cancelar:()=>{S.modal=null;S.crop=null;S.apagar=null},
  confirmarFechar:()=>{if(abasComItens()){S.modal=null;toast('Há venda em aberto. Finalize ou descarte antes de fechar o caixa.');return}const v=$('#md-contado').value.trim();if(!v){toast('Informe o dinheiro contado na gaveta.');return true}
    const f=fxAberto(S.user.id);
    q(sb.rpc('fechar_caixa',{p_fluxo:f.id,p_contado_centavos:parseMoney(v)})).then(async r=>{if(r){S.modal=null;toast(`Fluxo ${f.n} fechado. A pesagem fica desabilitada até reabrir o caixa ou trocar de operador.`)}await carregarDia();render()});return true},
  reabrir:e=>{const id=e.dataset.id;if(fxAberto(id))return;
    q(sb.rpc('abrir_caixa',{p_operador:id})).then(async r=>{if(r&&r.numero)toast(`Caixa ${r.numero>1?'reaberto':'aberto'}: Fluxo ${r.numero}.`);await carregarDia();render()});return true},
  tara:e=>{bal(e.dataset.id).tara=+e.dataset.g},
  simular:e=>{if(!fxAberto(S.user.id))return;const s=bal(e.dataset.id);s.bruto=s.tara+(s.grupo==='acai'?200+Math.floor(Math.random()*400):250+Math.floor(Math.random()*550))},
  addPeso:e=>{S.abaConf=false;const s=bal(e.dataset.id),g=Math.max(0,s.bruto-s.tara);if(!g||!fxAberto(S.user.id))return;S.bump=true;S.pags=null;S.cart.push({src:s.id,tara:s.tara,desc:s.nome,grupo:s.grupo,g,precoKg:s.precoKg,valor:Math.round(g*s.precoKg/1000)});s.bruto=0},
  addProd:e=>{S.abaConf=false;if(!fxAberto(S.user.id))return;const p=S.produtos.find(x=>x.id===e.dataset.id);S.bump=true;S.pags=null;S.cart.push({src:p.id,desc:p.nome,grupo:'produto',cat:p.cat,valor:p.preco})},
  rmItem:e=>{S.cart.splice(+e.dataset.k,1);S.pags=null},
  novoCli:()=>{S.novoCli=!S.novoCli},
  salvarCli:()=>{const n=$('#nc-nome').value.trim(),f=$('#nc-fone').value.trim();if(!n||!f){toast('Preencha nome e WhatsApp do cliente.');return true}
    q(sb.from('clientes').insert({nome:n,telefone:f}).select().single(),'Cliente').then(async r=>{if(r&&r.id){await carregarBase();S.clienteId=r.id;S.novoCli=false;toast(n+' cadastrado no programa de pontos.')}render()});return true},
  resgate:()=>{S.resgate=!S.resgate;S.pags=null},
  forma:e=>{S.forma=e.dataset.f;S.pags=null},
  limparPags:()=>{S.pags=null},
  limparFil:()=>{S.fil={forma:'',tipo:'',op:'',cli:''};S.finLimite=200;carregarFin();return true},
  exportPdf:()=>{exportPdf();return true},
  todas:()=>{S.todas=!S.todas},
  abrirMisto:()=>{if(!S.cart.length)return;if(!(S.pags&&S.pags.tipo==='misto'))S.mx={pix:'',credito:'',debito:'',dinheiro:'',rec:''};S.modal='misto'},
  mxResto:e=>{const f=e.dataset.f,v=Math.max(0,parseMoney(S.mx[f])+mistoInfo().falta);S.mx[f]=v?num(v):''},
  confirmarMisto:()=>{const m=mistoInfo();if(!m.ok)return;const ls=Object.keys(FORMAS).filter(f=>parseMoney(S.mx[f])>0).map((f,k)=>({rot:'Parte '+(k+1),forma:f,valor:parseMoney(S.mx[f])}));
    if(ls.length===1){S.pags=null;S.forma=ls[0].forma;S.recebido=ls[0].forma==='dinheiro'?(S.mx.rec||num(m.t)):''}else{S.pags={tipo:'misto',linhas:ls,troco:m.troco};S.forma=''}S.modal=null},
  abrirDividir:()=>{if(!S.cart.length)return;if(!(S.pags&&S.pags.tipo==='dividida')){S.dv=[{valor:'',forma:''},{valor:'',forma:''}];dvIgual()}S.modal='dividir'},
  dvForma:e=>{S.dv[+e.dataset.k].forma=e.dataset.f},
  dvMais:()=>{if(S.dv.length<6){S.dv.push({valor:'',forma:''});dvIgual()}},
  dvMenos:e=>{S.dv.splice(+e.dataset.k,1);dvIgual()},
  dvIgualar:()=>{dvIgual()},
  confirmarDiv:()=>{if(!dvInfo().ok)return;S.pags={tipo:'dividida',linhas:S.dv.map((d,k)=>({rot:'Pessoa '+(k+1),forma:d.forma,valor:parseMoney(d.valor)}))};S.forma='';S.modal=null},
  quick:e=>{S.recebido=num(parseMoney(S.recebido)+ +e.dataset.v)},
  exato:()=>{S.recebido=num(totais().total)},
  limparRec:()=>{S.recebido=''},
  finalizar:()=>{if(!podeFinalizar()||S.enviando)return true;S.modal='confirmar'},
  finalizarNao:()=>{S.modal=null;toast('Venda não finalizada. Confirme o pagamento com o cliente.')},
  finalizarSim:()=>{
    S.modal=null;
    if(!podeFinalizar()||S.enviando){render();return true}
    const t=totais(),rec=parseMoney(S.recebido);
    const pags=S.pags?S.pags.linhas.map(l=>({rotulo:l.rot,forma:l.forma,valor_centavos:l.valor,recebido_centavos:l.forma==='dinheiro'&&S.pags.troco?l.valor+S.pags.troco:null}))
      :[{rotulo:'',forma:S.forma,valor_centavos:t.total,recebido_centavos:S.forma==='dinheiro'?rec:null}];
    const p={cliente_id:S.clienteId||null,usar_resgate:!!t.desc,tipo:S.pags?S.pags.tipo:'simples',
      itens:S.cart.map(i=>i.grupo==='produto'?{produto_id:i.src}:{balanca_id:i.src,gramas:i.g,tara_gramas:i.tara||0}),pagamentos:pags};
    const troco=S.pags?(S.pags.troco||0):S.forma==='dinheiro'?rec-t.total:0,nomeC=t.c?t.c.nome.split(' ')[0]:'';
    const como=S.pags?'('+S.pags.linhas.map(l=>FORMAS[l.forma]+' '+brl(l.valor)).join(' + ')+')':'no '+FORMAS[S.forma].toLowerCase();
    S.enviando=true;render();toast('Registrando a venda…');
    q(sb.rpc('registrar_venda',{p})).then(async r=>{S.enviando=false;
      if(!r||!r.numero){await carregarBase();return render()}
      toast(`Venda nº ${r.numero} de ${brl(r.total_centavos)} registrada ${como}`+(troco?` · Troco ${brl(troco)}`:'')+(r.pontos_ganhos?` · ${nomeC} ganhou ${r.pontos_ganhos} pontos`:''));
      {const k=S.aba,n=S.abas[k].n;S.abas[k]=Object.assign({n},vendaVazia());abaCarregar(k);
        if(S.abas.some((a,j)=>j!==k&&abaLivre(a))){S.abas.splice(k,1);abaCarregar(S.abas.findIndex(abaLivre))}
        const esp=S.abas.filter(a=>a.cart.length).length;if(esp)setTimeout(()=>toast(esp===1?'Lembrete: há 1 venda em espera nas abas.':'Lembrete: há '+esp+' vendas em espera nas abas.'),3500)}
      S.balancas.forEach(x=>x.bruto=0);
      await Promise.all([carregarDia(),carregarBase()]);render()});return true},
  togDestaque:e=>{const x=S.produtos.find(y=>y.id===e.dataset.id);salvar(sb.from('produtos').update({destaque:!x.destaque}).eq('id',x.id));return true},
  rmProd:e=>{salvar(sb.from('produtos').update({ativo:false}).eq('id',e.dataset.id),'Produto removido do Caixa.');return true},
  novoProd:()=>{const n=$('#np2-nome').value.trim(),v=parseMoney($('#np2-preco').value);if(!n||!v){toast('Preencha o nome e o preço do produto.');return true}
    salvar(sb.from('produtos').insert({nome:n,categoria:$('#np2-cat').value,preco_centavos:v}),n+' cadastrado. Já aparece no Caixa.');return true},
  togPrato:e=>{const x=S.cardapio[+e.dataset.k];salvar(sb.from('cardapio_itens').update({disponivel:!x.on}).eq('id',x.id));return true},
  rmPrato:e=>{salvar(sb.from('cardapio_itens').delete().eq('id',S.cardapio[+e.dataset.k].id));return true},
  addPrato:()=>{const n=$('#np-nome').value.trim();if(!n){toast('Digite o nome do prato.');return true}
    salvar(sb.from('cardapio_itens').insert({categoria:$('#np-cat').value,nome:n}));return true},
  periodo:e=>{S.periodo=e.dataset.p;S.finLimite=200;carregarFin();return true},
  finAnt:()=>{mudarRef(-1);return true},
  finProx:()=>{mudarRef(1);return true},
  finHoje:()=>{S.refData=ymd(new Date());S.finLimite=200;carregarFin();return true},
  finAtualizar:()=>{carregarFin();return true},
  finMais:()=>{S.finLimite+=200;carregarFin();return true},
  fechar:e=>{const id=e.dataset.id;
    q(sb.rpc('fechar_caixa',{p_fluxo:id,p_contado_centavos:parseMoney(S.contado[id])})).then(async r=>{if(r){delete S.contado[id];toast(`Fluxo ${e.dataset.n} fechado.`)}await carregarDia();carregarFin()});return true},
  addBal:()=>{const n=S.balancas.length+1;salvar(sb.from('balancas').insert({nome:'Balança '+n,grupo:'comida',preco_kg_centavos:6990,ordem:n}),'Balança adicionada. Ela já aparece no Caixa.');return true},
  conectar:e=>{const s=bal(e.dataset.id);s.conectada=!s.conectada},
  testar:e=>{const s=bal(e.dataset.id);if(!s.conectada)return toast('Conecte a balança antes de testar.');toast(`${s.nome}: leitura de teste ${kg(300+Math.floor(Math.random()*400))} (simulada).`)},
  copiar:e=>{const txt={cardapio:cardapioTexto,resumo:resumoTexto,payload}[e.dataset.t]();try{navigator.clipboard.writeText(txt).then(()=>toast('Copiado.'),()=>toast('Não foi possível copiar aqui. Selecione o texto e copie.'))}catch(_){toast('Não foi possível copiar aqui. Selecione o texto e copie.')}return true}
};
const C={
  taraManual:e=>{bal(e.dataset.id).tara=Math.max(0,parseInt(e.value,10)||0)},
  cliente:e=>{S.clienteId=e.value;S.resgate=false;S.pags=null},
  regra:e=>{const k=e.dataset.k,M={base:'base_pontos',pontosResgate:'pontos_resgate',valorResgate:'valor_resgate_centavos',minGrupo:'min_pontos_grupo'},v=k==='base'?e.value:k==='valorResgate'?parseMoney(e.value):Math.max(0,parseInt(e.value,10)||0);
    if(k==='pontosResgate'&&v<1)return toast('Os pontos para resgatar precisam ser pelo menos 1.');
    salvar(sb.from('config').update({[M[k]]:v}).eq('id',1),'Regra atualizada.')},
  contado:e=>{S.contado[e.dataset.id]=e.value.trim()},
  bal:e=>{const s=bal(e.dataset.id),k=e.dataset.k;let c;
    if(k==='precoKg'){const v=parseMoney(e.value);if(!v||v===s.precoKg)return;c={preco_kg_centavos:v}}
    else if(k==='baud')c={baud:parseInt(e.value,10)};
    else if(k==='nome'){const n=e.value.trim();if(!n||n===s.nome)return;c={nome:n}}
    else c={[k]:e.value};
    salvar(sb.from('balancas').update(c).eq('id',s.id),'Balança atualizada.')},
  prod:e=>{const x=S.produtos.find(y=>y.id===e.dataset.id),k=e.dataset.k;let c;
    if(k==='preco'){const v=parseMoney(e.value);if(!v||v===x.preco)return;c={preco_centavos:v}}
    else if(k==='nome'){const n=e.value.trim();if(!n||n===x.nome)return;c={nome:n}}
    else c={categoria:e.value};
    salvar(sb.from('produtos').update(c).eq('id',x.id),'Produto atualizado.')},
  avatarArq:e=>{const f=e.files&&e.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('Escolha um arquivo de imagem.');
    const rd=new FileReader();rd.onload=()=>{const im=new Image();
      im.onload=()=>{if(!im.width||!im.height)return toast('Não foi possível ler essa imagem.');S.crop={im,w:im.width,h:im.height,z:1,ox:0,oy:0};render()};
      im.onerror=()=>toast('Não foi possível ler essa imagem.');im.src=rd.result};rd.readAsDataURL(f)},
  fil:e=>{S.fil[e.dataset.k]=e.value;S.finLimite=200;carregarFin()},
  finData:e=>{if(e.value){S.refData=e.value;S.finLimite=200;carregarFin()}},
  userPerfil:e=>{const u=S.perfis.find(x=>x.id===e.dataset.id);mudarPerfil(u.id,{perfil:e.value},'Perfil de '+u.nome+' alterado.')},
  waUrl:e=>{S.wa.url=e.value.trim()},
  waEv:e=>{S.wa.eventos[e.dataset.k]=e.checked}
};
document.addEventListener('click',ev=>{if(S.menu&&window.innerWidth<=980&&!ev.target.closest('nav')&&!ev.target.closest('[data-a="menu"]')){S.menu=false;render();return}const e=ev.target.closest('[data-a]');if(!e||e.disabled)return;const keep=A[e.dataset.a](e);if(!keep)render()});
document.addEventListener('change',ev=>{const e=ev.target.closest('[data-c]');if(!e)return;C[e.dataset.c](e);render()});
document.addEventListener('input',ev=>{const t=ev.target;
  if(S.crop&&t.id==='crop-z'){S.crop.z=+t.value;cropDesenhar();return}
  if(S.conta&&t.id==='cs-nome')S.conta.nome=t.value;
  if(S.conta&&t.id==='cs-nova')S.conta.senha=t.value;
  if(t.dataset&&t.dataset.m!==undefined){const d=t.value.replace(/\D/g,'');t.value=d?num(parseInt(d,10)):''}
  if(t.id==='recebido'){S.recebido=t.value;const tb=trocoBox(),x=$('#troco');x.className=tb.c;x.innerHTML=tb.h;$('#finalizar').disabled=!podeFinalizar()}
  else if(t.dataset.i==='mx'){S.mx[t.dataset.f]=t.value;const m=mistoInfo();$('#mx-status').innerHTML=statusBox(m);$('#mx-ok').disabled=!m.ok;$('#mx-troco').textContent=m.troco?'Troco '+brl(m.troco):''}
  else if(t.dataset.i==='dv'){S.dv[+t.dataset.k].valor=t.value;const m=dvInfo();$('#dv-status').innerHTML=statusBox(m,!m.falta&&!m.ok);$('#dv-ok').disabled=!m.ok}
});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;if(ev.target.id==='ap-senha'){ev.preventDefault();const o=document.getElementById('ap-ok');if(o)o.click();return}const cx=ev.target.closest&&ev.target.closest('#login');const b=cx&&cx.querySelector('[data-enter]');if(b){ev.preventDefault();b.click()}});
function rota(){const h=(location.hash||'').slice(1);if(RENDER[h])S.view=h;render()}
window.addEventListener('hashchange',rota);
rota();
if(!sb){S.auth='erro';S.authMsg='Não foi possível carregar a conexão com o banco de dados. Verifique a internet e recarregue a página.';render()}
else sb.auth.onAuthStateChange((ev,sess)=>{
  if(ev==='PASSWORD_RECOVERY')S.recuperando=true;
  if(sess&&S.auth==='ok'&&S.perfil&&S.perfil.id===sess.user.id&&!S.recuperando)return;
  setTimeout(()=>aoSessao(sess),0);
});
setInterval(()=>{const c=$('#clock');if(c)c.textContent=hhmm(new Date())},30000);
</script>
